name: Actualizar datos

# Cada hora (minuto 17) consulta las fuentes y publica data en la rama "datos".
# La app lee ese archivo al abrirse, sin esperar a las APIs.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests

      - name: Consultar fuentes
        run: python actualizar_datos.py salida/vivo.json

      - name: Publicar en la rama "datos" (conservando exposicion.json)
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/datos/exposicion.json" -o salida/exposicion.json || true
          cd salida
          git init -q -b datos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Datos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" datos
